---
- name: Installers - Oh My Zsh
  block:
    - name: Installers - Oh My Zsh - Clone oh-my-zsh
      ansible.builtin.git:
        repo: https://github.com/ohmyzsh/ohmyzsh.git
        dest: "{{ ansible_env.HOME }}/.oh-my-zsh"
        depth: 1
        update: no

    - name: Installers - Oh My Zsh - Ensure custom plugin directory exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.oh-my-zsh/custom/plugins"
        state: directory
        mode: "0755"

    - name: Installers - Oh My Zsh - Install zsh-syntax-highlighting
      ansible.builtin.git:
        repo: https://github.com/zsh-users/zsh-syntax-highlighting
        dest: "{{ ansible_env.HOME }}/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting"
        depth: 1
        update: no
